<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Stock | Out Silver</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #1a1a1a;
            --color-accent: #ff5000;
            --color-bg: #f9f9f9;
            --color-surface: #ffffff;
            --color-border: #e0e0e0;
            --color-text: #333333;
            --color-text-muted: #666666;
            --border-radius: 8px;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 250px;
            background-color: var(--color-primary);
            color: white;
            display: flex;
            flex-direction: column;
            padding-top: 30px;
        }

        .sidebar-logo {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            color: white;
            text-decoration: none;
            letter-spacing: 1px;
        }
        
        .sidebar-logo span {
            color: var(--color-accent);
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li {
            width: 100%;
        }

        .sidebar-menu a {
            display: block;
            padding: 15px 25px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border-left-color: var(--color-accent);
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
        }

        .admin-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--color-surface);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--color-primary);
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: var(--color-text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .product-list {
            margin-bottom: 30px;
        }

        .product-select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }
        
        .product-select:focus {
            border-color: var(--color-accent);
        }

        .stock-editor {
            display: none; /* Hidden until a product is selected */
            margin-top: 20px;
            border-top: 1px solid var(--color-border);
            padding-top: 20px;
        }

        .stock-editor h3 {
            margin-top: 0;
            color: var(--color-primary);
        }
        
        .product-preview {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
        }
        
        .product-preview img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: var(--border-radius);
            border: 1px solid var(--color-border);
        }

        .stock-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .stock-table th, .stock-table td {
            border: 1px solid var(--color-border);
            padding: 12px;
            text-align: center;
        }

        .stock-table th {
            background-color: var(--color-bg);
            font-weight: 600;
        }
        
        .color-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        
        .color-swatch {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid #ccc;
        }

        .stock-input {
            width: 60px;
            padding: 8px;
            text-align: center;
            border: 1px solid var(--color-border);
            border-radius: 4px;
            font-family: inherit;
        }

        .stock-input:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .btn {
            background-color: #f1f1f1;
            color: var(--color-text);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: inherit;
        }

        .btn:hover {
            background-color: #e4e4e4;
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--color-accent);
        }
        
        .btn-secondary {
            background-color: #ffffff;
            color: var(--color-primary);
            border: 1px solid var(--color-border);
        }

        .btn-secondary:hover {
            background-color: #f1f1f1;
            border-color: #ccc;
        }
        
        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }
        
        #status-box {
            background-color: #f0f4f8;
            padding: 15px;
            border-radius: var(--border-radius);
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: var(--border-radius);
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .modal-content h3 {
            margin-top: 0;
            color: var(--color-primary);
            margin-bottom: 20px;
        }

        .modal-form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .modal-form-group label {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

    </style>
</head>
<body>

    <aside class="sidebar">
        <a href="index.html" class="sidebar-logo">OUT<span>SILVER</span></a>
        <ul class="sidebar-menu">
            <li><a href="admin.html">Panel de Administración</a></li>
            <li><a href="editar.html">Editar Producto</a></li>
            <li><a href="stock.html" class="active">Gestión de Stock</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="admin-container">
            <h1>📦 Gestión de Stock</h1>
            <p class="subtitle">Controla el inventario de tus productos por talla y color.</p>

            <div id="status-box">
                Cargando base de datos local...
            </div>

            <div class="product-list">
                <label for="product-selector" style="font-weight: 600; display: block; margin-bottom: 8px;">Selecciona un Producto:</label>
                <select id="product-selector" class="product-select">
                    <option value="">-- Seleccionar --</option>
                </select>
            </div>

            <div id="stock-editor" class="stock-editor">
                <div class="product-preview" id="product-preview">
                    <!-- Preview content injected by JS -->
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0;">Inventario por Talla y Color</h3>
                    <div style="display: flex; gap: 10px;">
                        <button type="button" class="btn btn-secondary" id="btn-add-color" style="padding: 8px 15px; font-size: 0.9rem;">+ Añadir Color</button>
                        <button type="button" class="btn btn-secondary" id="btn-add-size" style="padding: 8px 15px; font-size: 0.9rem;">+ Añadir Talla</button>
                    </div>
                </div>
                <div style="overflow-x: auto;">
                    <table class="stock-table" id="stock-table">
                        <!-- Table injected by JS -->
                    </table>
                </div>

                <div class="actions">
                    <button type="button" class="btn btn-primary" id="btn-save">Guardar Cambios de Stock</button>
                </div>
            </div>
        </div>

        <!-- Color Modal -->
        <div class="modal-overlay" id="color-modal">
            <div class="modal-content">
                <h3>Añadir Nuevo Color</h3>
                
                <div class="modal-form-group">
                    <label for="new-color-picker">Selecciona el color:</label>
                    <input type="color" id="new-color-picker" value="#ff5000" style="width: 100%; height: 50px; cursor: pointer;">
                </div>
                
                <div class="modal-form-group">
                    <label for="new-color-name">Nombre del color:</label>
                    <input type="text" id="new-color-name" placeholder="Ej: Naranja Neón" autocomplete="off" style="padding: 10px; border: 1px solid var(--color-border); border-radius: 4px; font-family: inherit;">
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn" id="btn-cancel-color">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-confirm-color">Aceptar</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Base de datos de productos -->
    <script src="js/productos-db.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusBox = document.getElementById('status-box');
            const productSelector = document.getElementById('product-selector');
            const stockEditor = document.getElementById('stock-editor');
            const productPreview = document.getElementById('product-preview');
            const stockTable = document.getElementById('stock-table');
            const btnSave = document.getElementById('btn-save');
            
            let currentProductId = null;
            let currentProduct = null;

            if (window.productosData && Array.isArray(window.productosData)) {
                statusBox.innerHTML = `<strong>Estado:</strong> Conectado a la base de datos. Tienes <strong>${window.productosData.length} productos</strong> actualmente.`;
                populateProductDropdown();
            } else {
                statusBox.innerHTML = `<strong style="color:red;">Error:</strong> No se pudo cargar js/productos-db.js.`;
            }

            function populateProductDropdown() {
                window.productosData.forEach(prod => {
                    const option = document.createElement('option');
                    option.value = prod.id;
                    option.textContent = prod.titulo;
                    productSelector.appendChild(option);
                });
            }

            productSelector.addEventListener('change', (e) => {
                currentProductId = e.target.value;
                if (currentProductId) {
                    currentProduct = window.productosData.find(p => p.id === currentProductId);
                    renderStockEditor(currentProduct);
                    stockEditor.style.display = 'block';
                } else {
                    currentProduct = null;
                    stockEditor.style.display = 'none';
                }
            });

            const colorNamesMap = {
                "#b0b0b0": "Gris",
                "#b22222": "Rojo",
                "#8b5a2b": "Marrón",
                "#4169e1": "Azulino",
                "#1d2a44": "Azul Marino",
                "#0b1d3a": "Navy",
                "#c68a4c": "Mostaza",
                "#7c9e83": "Verde",
                "#333333": "Negro",
                "#1a5fb4": "Azul",
                "#f4f4f4": "Blanco",
                "#a0e0ff": "Celeste",
                "#76e5c1": "Cemento",
                "#ff7a00": "Amarillo",
                "#a3e12c": "Olivo"
            };

            function renderStockEditor(product) {
                // Render preview
                productPreview.innerHTML = `
                    <img src="${product.imagen_principal}" alt="${product.titulo}" onerror="this.src='https://via.placeholder.com/80'">
                    <div>
                        <strong style="font-size: 1.2rem;">${product.titulo}</strong><br>
                        <span style="color: #666; font-size: 0.9rem;">Categoría: ${product.categoria} | Precio: S/ ${product.precio}</span>
                    </div>
                `;

                // Parse tallas
                const tallas = product.tallas ? product.tallas.split(',').map(t => t.trim()).filter(t => t !== "") : [];
                const colores = product.colores_hex && product.colores_hex.length > 0 ? product.colores_hex : ["default"];
                
                // Initialize stock object if not present
                if (!product.stock) {
                    product.stock = {};
                }

                // Render table
                let thead = `<tr><th>Color / Talla</th>`;
                tallas.forEach(talla => {
                    thead += `<th>Talla ${talla}</th>`;
                });
                thead += `</tr>`;

                let tbody = ``;
                colores.forEach(color => {
                    // Ensure color object exists in stock
                    if (!product.stock[color]) {
                        product.stock[color] = {};
                    }
                    
                    let colorName = colorNamesMap[color.toLowerCase()] || color;
                    let colorLabel = color === "default" ? "Único/Default" : 
                        `<div class="color-cell"><div class="color-swatch" style="background-color: ${color}"></div> <span>${colorName}</span></div>`;
                        
                    tbody += `<tr><td>${colorLabel}</td>`;
                    
                    tallas.forEach(talla => {
                        const currentStock = product.stock[color][talla] || 0;
                        tbody += `<td>
                            <input type="number" min="0" class="stock-input" data-color="${color}" data-talla="${talla}" value="${currentStock}">
                        </td>`;
                    });
                    
                    tbody += `</tr>`;
                });

                if (tallas.length === 0) {
                    stockTable.innerHTML = `<tr><td colspan="100%" style="color:red">Este producto no tiene tallas definidas.</td></tr>`;
                } else {
                    stockTable.innerHTML = `<thead>${thead}</thead><tbody>${tbody}</tbody>`;
                }
            }

            const btnAddColor = document.getElementById('btn-add-color');
            const btnAddSize = document.getElementById('btn-add-size');

            function saveCurrentInputsToStock() {
                if (!currentProduct) return;
                const inputs = stockTable.querySelectorAll('.stock-input');
                inputs.forEach(input => {
                    const color = input.getAttribute('data-color');
                    const talla = input.getAttribute('data-talla');
                    const val = parseInt(input.value) || 0;
                    
                    if (!currentProduct.stock[color]) {
                        currentProduct.stock[color] = {};
                    }
                    currentProduct.stock[color][talla] = val;
                });
            }

            const colorModal = document.getElementById('color-modal');
            const btnCancelColor = document.getElementById('btn-cancel-color');
            const btnConfirmColor = document.getElementById('btn-confirm-color');
            const newColorPicker = document.getElementById('new-color-picker');
            const newColorNameInput = document.getElementById('new-color-name');

            btnAddColor.addEventListener('click', () => {
                if (!currentProduct) return;
                // Show modal
                newColorNameInput.value = '';
                colorModal.style.display = 'flex';
                newColorNameInput.focus();
            });

            btnCancelColor.addEventListener('click', () => {
                colorModal.style.display = 'none';
            });

            btnConfirmColor.addEventListener('click', () => {
                let newColor = newColorPicker.value; // It comes as hex e.g. #ff0000
                let newColorName = newColorNameInput.value.trim();

                if (!newColorName) {
                    alert("Por favor, ingresa el nombre del color.");
                    return;
                }

                colorModal.style.display = 'none';

                // Add to our runtime map so it renders properly in this session
                colorNamesMap[newColor.toLowerCase()] = newColorName;

                saveCurrentInputsToStock();
                
                if (!currentProduct.colores_hex) {
                    currentProduct.colores_hex = [];
                }
                // Remove "default" if it's there
                if (currentProduct.colores_hex.length === 0 || (currentProduct.colores_hex.length === 1 && currentProduct.colores_hex[0] === "default")) {
                    currentProduct.colores_hex = [];
                }
                
                if (!currentProduct.colores_hex.includes(newColor)) {
                    currentProduct.colores_hex.push(newColor);
                    renderStockEditor(currentProduct);
                } else {
                    alert("Ese color ya existe en el producto.");
                }
            });

            btnAddSize.addEventListener('click', () => {
                if (!currentProduct) return;
                const newSize = prompt("Ingresa la nueva talla (ej. 18, XXL, Única):");
                if (newSize && newSize.trim() !== "") {
                    saveCurrentInputsToStock();
                    
                    let tallasArray = currentProduct.tallas ? currentProduct.tallas.split(',').map(t => t.trim()).filter(t => t !== "") : [];
                    if (!tallasArray.includes(newSize.trim())) {
                        tallasArray.push(newSize.trim());
                        currentProduct.tallas = tallasArray.join(',');
                        renderStockEditor(currentProduct);
                    } else {
                        alert("Esa talla ya existe en el producto.");
                    }
                }
            });

            btnSave.addEventListener('click', async () => {
                if (!currentProduct) return;

                // Gather data from inputs
                saveCurrentInputsToStock();

                // Convert to JS string
                const jsContent = `window.productosData = ${JSON.stringify(window.productosData, null, 4)};`;

                if (!window.showSaveFilePicker) {
                    alert('Tu navegador no soporta el guardado directo de archivos (File System Access API). Por favor usa Google Chrome, Microsoft Edge, o Brave en tu PC.');
                    return;
                }

                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'productos-db.js',
                        types: [{
                            description: 'JavaScript File',
                            accept: {'text/javascript': ['.js']},
                        }],
                    });

                    const writable = await handle.createWritable();
                    await writable.write(jsContent);
                    await writable.close();

                    alert('¡Stock actualizado correctamente!');
                    
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        console.error(error);
                        alert('Hubo un error al guardar el archivo: ' + error.message);
                    }
                }
            });
        });
    </script>
</body>
</html>
